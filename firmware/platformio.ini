; RIBO-TH vessel MCU — Arduino UNO Q (STM32U585)
; Upload from the board's Linux side, or via PlatformIO Remote from a Mac.

[platformio]
default_envs = uno_q

[env:uno_q]
platform = https://github.com/lee-lab-skku/platform-arduinoq.git
board = uno_q
framework = arduino
monitor_speed = 115200
lib_deps =
    https://github.com/lee-lab-skku/arduino-router-bridge.git
build_src_filter = +<*>
