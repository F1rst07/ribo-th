<!doctype html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#ffcc00" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="description" content="RIBO-TH กำลังพัฒนาเว็บไซต์และปรับปรุงระบบ" />
  <title>กำลังพัฒนาอยู่... | RIBO-TH</title>
  <style>
    :root { font-family: -apple-system, BlinkMacSystemFont, "Noto Sans Thai", "Segoe UI", sans-serif; color: #242424; background: #fff; }
    * { box-sizing: border-box; }
    body { min-width: 300px; margin: 0; }
    .page { min-height: 100svh; display: flex; flex-direction: column; }
    .hazard { height: 46px; flex: 0 0 auto; background: repeating-linear-gradient(125deg, #171717 0 51px, #ffcc00 51px 102px); }
    main { width: 100%; flex: 1; display: grid; place-items: center; padding: 48px 24px 55px; }
    .content { text-align: center; max-width: 820px; animation: rise-in 800ms cubic-bezier(.2,.7,.2,1) both; }
    .symbol { width: 126px; height: 126px; margin: 0 auto 31px; display: grid; place-items: center; background: #fff2c3; border-radius: 50%; position: relative; }
    .symbol:before { content: ""; position: absolute; inset: 0; border: 2px solid #f0c843; border-radius: inherit; animation: pulse 3.5s ease-out infinite; }
    .symbol .spinning-icon { width: 47px; height: 47px; display: block; animation: rotate 10s linear infinite; }
    .symbol img { display: block; width: 47px; height: 47px; transform: scaleX(-1); filter: invert(62%) sepia(100%) saturate(1197%) hue-rotate(2deg) brightness(98%) contrast(101%); }
    h1 { font-size: clamp(30px, 4vw, 42px); letter-spacing: -.04em; margin: 0 0 22px; font-weight: 750; line-height: 1.35; }
    .tag { display: inline-block; border-radius: 999px; background: #fff2c5; color: #785800; font-size: 15px; font-weight: 650; letter-spacing: .05em; padding: 8px 18px; }
    .description { margin: 37px 0 0; font-size: clamp(17px, 2.3vw, 23px); line-height: 1.85; color: #777; }
    .apology { margin: 19px 0 0; font-size: clamp(17px, 2.2vw, 22px); color: #777; line-height: 1.7; }
    footer { background: #252a30; padding: 29px 20px 31px; text-align: center; color: #fff; }
    footer p { margin: 0; font-size: clamp(14px, 1.7vw, 19px); line-height: 1.6; }
    footer .credit { color: #b9c0c8; font-size: clamp(13px, 1.5vw, 17px); margin-top: 8px; }
    @keyframes rotate { to { transform: rotate(360deg); } }
    @keyframes rise-in { from { opacity: 0; transform: translateY(17px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes pulse { 0% { transform: scale(1); opacity: .55; } 75%, 100% { transform: scale(1.25); opacity: 0; } }
    @media (max-width: 600px) { .hazard { height: 26px; background: repeating-linear-gradient(125deg,#171717 0 29px,#ffcc00 29px 58px); } main { padding: 55px 20px; } .symbol { width: 106px; height: 106px; margin-bottom: 26px; } .description { margin-top: 29px; } footer { padding: 25px 14px 27px; } }
    @media (prefers-reduced-motion: reduce) { *, *:before, *:after { animation: none !important; } }
  </style>
</head>
<body>
  <div class="page">
    <div class="hazard" aria-hidden="true"></div>
    <main>
      <section class="content" aria-labelledby="status-heading">
        <div class="symbol" aria-hidden="true">
          <span class="spinning-icon"><img src="https://cdn.jsdelivr.net/npm/lucide-static@0.468.0/icons/refresh-ccw.svg" alt="" width="47" height="47" /></span>
        </div>
        <h1 id="status-heading">กำลังพัฒนาอยู่...</h1>
        <span class="tag">UNDER CONSTRUCTION</span>
        <p class="description">ขณะนี้เว็บไซต์อยู่ระหว่างการพัฒนาและปรับปรุงระบบ</p>
        <p class="apology">ขออภัยในความไม่สะดวก</p>
      </section>
    </main>
    <footer>
      <p>© 2026 RIBO-TH. All Rights Reserved.</p>
      <p class="credit">Developed by K. Phiraphatz</p>
    </footer>
  </div>
</body>
</html>
